# _config.yml
title: ChainCert
description: >-
  Blockchain Certification for DO-254 & DO-178. 
  Compliance-as-Code on Hyperledger Fabric.
baseurl: "" # Leave empty for GitHub Pages
url: "https://chaincert.com" # Your custom domain
github_username: Chain-Cert

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
